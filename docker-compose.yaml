networks:
  project-lex:
    driver: bridge

services:
  # infrastructure services
  dns:
    image: coredns/coredns:latest
    platform: linux/arm64/v8
    container_name: dns
    hostname: dns
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./docker/Corefile:/Corefile:ro
    restart: unless-stopped
    networks:
      - project-lex

  proxy:
    image: nginx:alpine
    container_name: proxy
    hostname: proxy
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx-proxy-http.conf:/etc/nginx/conf.d/00-http.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - project-lex

  vault:
    image: hashicorp/vault
    container_name: vault
    hostname: vault
    command: server -dev
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_ADDR=http://0.0.0.0:8200
    user: root
    volumes:
      - .vault_data:/vault/file
    ports:
      - "8200:8200"
    networks:
      - project-lex

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=logging
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    secrets:
      - postgres_password
    command: >
      postgres -c timescaledb.telemetry_level=off
               -c max_connections=200
               -c shared_buffers=512MB
               -c work_mem=32MB
               -c maintenance_work_mem=128MB
               -c effective_cache_size=1GB
    networks:
      - project-lex

  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_password
      - MONGO_INITDB_DATABASE=project-lex
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    secrets:
      - mongo_password
    networks:
      - project-lex

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    hostname: mongo-express
    depends_on:
      - mongodb
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    secrets:
      - mongo_password
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "export ME_CONFIG_MONGODB_ADMINPASSWORD=$(cat /run/secrets/mongo_password) && node app",
      ]
    restart: unless-stopped
    networks:
      - project-lex

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    hostname: filebrowser
    user: root
    volumes:
      - configs_data:/srv
      - filebrowser_db:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/srv
      - FB_NOAUTH=true
    restart: unless-stopped
    networks:
      - project-lex

  configs:
    image: nginx:alpine
    container_name: configs
    hostname: configs
    user: root
    volumes:
      - configs_data:/usr/share/nginx/html:ro
      - ./docker/nginx-configs.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx-configs-nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - project-lex

  # application services
  config-management:
    image: project-lex/config-management:dev-local
    container_name: config-management
    ports:
      - "4000:3000"
    environment:
      GIT_TOKEN: ${CM_GIT_TOKEN}
      GIT_USERNAME: ${CM_GIT_USERNAME}
      GIT_URL: ${CM_GIT_URL}
      GIT_BRANCH: ${CM_GIT_BRANCH}
      MONGODB_URI: ${CM_MONGODB_URI}
      MONGODB_DB: ${CM_MONGODB_DB}
      MONGODB_COLLECTION: ${CM_MONGODB_COLLECTION}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_SECRET_PATH: ${CM_VAULT_SECRET_PATH}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE}
    networks:
      - project-lex

  config-validator:
    image: project-lex/config-validator:dev-local
    container_name: config-validator
    ports:
      - "4001:3000"
    environment:
      PORT: ${CV_PORT}
      NODE_ENV: ${CV_NODE_ENV}
      CONFIG_BASE_URL: ${CV_CONFIG_BASE_URL}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_SECRET_PATH: ${CV_VAULT_SECRET_PATH}
      MONGODB_URI: ${CV_MONGODB_URI}
      MONGODB_DB: ${CV_MONGODB_DB}
      MONGODB_COLLECTION: ${CV_MONGODB_COLLECTION}
      MONGODB_AUTH_SOURCE: ${CV_MONGODB_AUTH_SOURCE}
    volumes:
      - config-validator_data:/resources
    restart: unless-stopped
    networks:
      - project-lex

  scheduler:
    image: project-lex/scheduler:dev-local
    container_name: scheduler
    ports:
      - "4002:8080"
    environment:
      PORT: ${SCHEDULER_PORT}
      NODE_ENV: ${SCHEDULER_NODE_ENV}
      CONFIG_BASE_URL: ${SCHEDULER_CONFIG_BASE_URL}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_SECRET_PATH: ${SCHEDULER_VAULT_SECRET_PATH}
      MONGO_URI: ${SCHEDULER_MONGO_URI}
      MONGO_DATABASE: ${SCHEDULER_MONGO_DATABASE}
      MONGO_COLLECTION: ${SCHEDULER_MONGO_COLLECTION}
      MONGO_AUTH_SOURCE: ${SCHEDULER_MONGO_AUTH_SOURCE}
      WEBHOOK_URL: ${SCHEDULER_WEBHOOK_URL}
    secrets:
      - mongo_password
    restart: unless-stopped
    networks:
      - project-lex

  queue-management:
    image: project-lex/queue-management:dev-local
    container_name: queue-management
    ports:
      - "4003:3000"
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE}
      VAULT_SECRET_PATH: ${QM_VAULT_SECRET_PATH}
      FORWARD_URL: ${QM_FORWARD_URL}
      MONGODB_URI: ${QM_MONGODB_URI}
      MONGODB_DB: ${QM_MONGODB_DB}
      MONGODB_COLLECTION: ${QM_MONGODB_COLLECTION}
      MONGODB_AUTH_SOURCE: ${QM_MONGODB_AUTH_SOURCE}
    restart: unless-stopped
    networks:
      - project-lex

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  mongo_password:
    file: ./secrets/mongo_password.txt

volumes:
  timescale_data:
    name: timescale_data
  vault_data:
    name: vault_data
  mongodb_data:
    name: mongodb_data
  mongodb_config:
    name: mongodb_config
  configs_data:
    name: configs_data
  filebrowser_db:
    name: filebrowser_db
  config-validator_data:
    name: config-validator_data
